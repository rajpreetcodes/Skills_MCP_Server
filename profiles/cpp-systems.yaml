  - review
  - verification-before-completion
guidelines:
  - "Zero-overhead abstractions: Leverage compile-time evaluation (constexpr, consteval) and C++20 concepts to eliminate runtime dispatch costs without sacrificing type safety."
  - "Cache-friendly data structures: Prefer contiguous memory layouts (std::vector, std::array) and structure-of-arrays layouts over linked pointer chains to maximize CPU cache line efficiency."
  - "Undefined behavior avoidance: Compile with strict warning flags (-Wall -Wextra -Wpedantic -Werror) and regularly audit code with AddressSanitizer (ASan) and UndefinedBehaviorSanitizer (UBSan)."
  - "RAII and ownership: Adhere strictly to Resource Acquisition Is Initialization (RAII) using smart pointers (std::unique_ptr, std::shared_ptr) to guarantee deterministic resource destruction."
  - "Concurrency safety: Use ThreadSanitizer (TSan) to detect data races in multithreaded logic, and prefer lock-free atomics (std::atomic) or structured task parallelism."
