best_practices:
  - "Non-root user execution: Explicitly define USER with a non-zero UID/GID (e.g. USER 10001:10001) to prevent container escape escalations."
  - "Multi-stage builds: Separate build environments from runtime artifacts to produce lean, attack-surface minimized production images."
  - "Layer caching & order: Place frequently changing files (e.g. application code) towards the bottom of Dockerfiles to maximize layer cache hits."
  - "Pinned base image digests: Pin base images using immutable SHA-256 digests (e.g. alpine@sha256:...) instead of volatile tags."
  - "Automated vulnerability scanning: Integrate Hadolint for Dockerfile linting and Trivy for container image CVE scanning in CI pipelines."
guidelines:
  - "Non-root user execution: Explicitly define USER with a non-zero UID/GID (e.g. USER 10001:10001) to prevent container escape escalations."
  - "Multi-stage builds: Separate build environments from runtime artifacts to produce lean, attack-surface minimized production images."
  - "Layer caching & order: Place frequently changing files (e.g. application code) towards the bottom of Dockerfiles to maximize layer cache hits."
  - "Pinned base image digests: Pin base images using immutable SHA-256 digests (e.g. alpine@sha256:...) instead of volatile tags."
  - "Automated vulnerability scanning: Integrate Hadolint for Dockerfile linting and Trivy for container image CVE scanning in CI pipelines."
