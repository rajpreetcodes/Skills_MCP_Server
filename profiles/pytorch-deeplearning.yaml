best_practices:
  - "Mixed precision training: Use torch.cuda.amp.autocast with fp16 or bf16 to reduce VRAM memory consumption and accelerate compute throughput."
  - "Gradient checkpointing: Enable gradient checkpointing on transformer backbones to trade minor compute overhead for substantial memory savings."
  - "Validation loss early stopping: Monitor validation loss with patience counters and checkpoint saving to prevent overfitting."
  - "Reproducible random seeding: Explicitly seed torch.manual_seed, np.random.seed, and deterministic CUDA flags for reproducible experiment outcomes."
  - "PEFT and quantization: Utilize 4-bit or 8-bit quantization with bitsandbytes combined with LoRA target modules for parameter-efficient adaptation."
