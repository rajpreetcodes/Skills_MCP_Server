best_practices:
  - "Cache stampede mitigation: Use probabilistic early expiration (XFetch algorithm), mutex locking, or background cache warmers to prevent simultaneous misses."
  - "Key naming and TTL: Use consistent hierarchical namespaces with colons (e.g., service:entity:id), and always define explicit TTL expiration to avoid unbounded memory growth."
  - "Atomic updates with Lua: Encapsulate multi-step read-modify-write workflows into Lua scripts or Redis Functions for atomic execution without race conditions."
  - "Distributed locking: Implement Redlock or monotonic lock tokens with strict TTL and release verification via compare-and-delete Lua scripts."
  - "Eviction policies: Align maxmemory-policy (volatile-lru, allkeys-lru, volatile-lfu) with data criticality and access patterns."
  - "Connection management: Use robust connection pooling with socket timeouts, retry with exponential backoff, and circuit breakers."
