best_practices:
  - "Least-privilege IAM: Design tightly scoped IAM policies with explicit Actions, Resources, and Condition keys, avoiding wildcard (*) permissions."
  - "Enforcement of MFA: Require Multi-Factor Authentication (MFA) on all interactive console logins and privileged assume-role policies."
  - "KMS key rotation: Use AWS Key Management Service (KMS) Customer Managed Keys (CMKs) with automatic annual key rotation enabled."
  - "Encryption everywhere: Enforce AES-256 or KMS encryption at rest for S3 buckets, EBS volumes, RDS instances, and TLS 1.3 in transit."
  - "Private subnet isolation: Deploy computing workloads in private subnets with NAT gateways, disabling public IPv4 addresses on worker nodes."
