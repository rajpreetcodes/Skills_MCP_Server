  - thiserror
  - review
  - verification-before-completion
tools:
  - cargo
  - clippy
  - wasm-pack
  - wasm-bindgen-cli
  - miri
  - cargo-audit
  - wasm-opt
best_practices:
  - "Ownership idioms: Embrace borrow checker semantics, minimizing Rc/Arc clones and avoiding unsafe pointer dereferencing."
  - "Robust error handling: Utilize thiserror for expressive domain library errors and anyhow for contextual application handling."
  - "WASM compatibility: Guard against target-incompatible native syscalls using conditional compilation (#[cfg(target_arch = 'wasm32')])."
  - "Safe concurrency: Utilize Tokio task channels and async message-passing primitives instead of shared mutable state."
  - "Strict compiler diagnostics: Enforce Clippy pedantic lints and zero-warning build policies across both native and Wasm compilation targets."
guidelines:
  - "Ownership idioms: Embrace borrow checker semantics, minimizing Rc/Arc clones and avoiding unsafe pointer dereferencing."
  - "Robust error handling: Utilize thiserror for expressive domain library errors and anyhow for contextual application handling."
  - "WASM compatibility: Guard against target-incompatible native syscalls using conditional compilation (#[cfg(target_arch = 'wasm32')])."
  - "Safe concurrency: Utilize Tokio task channels and async message-passing primitives instead of shared mutable state."
  - "Strict compiler diagnostics: Enforce Clippy pedantic lints and zero-warning build policies across both native and Wasm compilation targets."
