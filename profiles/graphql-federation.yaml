best_practices:
  - "Resolver batching via DataLoader: Wrap repeated database queries and downstream HTTP calls in DataLoader instances to eliminate N+1 roundtrips."
  - "Subgraph entity key design: Define deterministic, minimal @key(fields: '...') directives on federated entities for cross-subgraph resolution."
  - "Query depth and complexity limits: Enforce AST depth validation and cost calculation middleware to prevent denial-of-service from malicious nested queries."
  - "Schema governance: Use Apollo Rover CLI in CI to validate subgraph schemas and catch composition breaking changes before deployment."
  - "Field-level authorization: Implement granular authorization checks inside resolver contexts rather than trusting client-supplied identifiers."
guidelines:
